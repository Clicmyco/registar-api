spring.application.name=registrarapi
spring.config.import=optional:file:.env[.properties]

# 1. Database Connection Details
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/registrar_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}

# 2. JWT Security
jwt.secret=${JWT_SECRET}

# 3. Gmail SMTP
spring.mail.host=smtp.gmail.com
spring.mail.port=465
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_APP_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.ssl.enable=true

# 4. Hibernate (JPA) Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${SHOW_SQL:false}

# 5. Server Configuration

# 6. CORS Configuration
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
server.port=${PORT:8081}

# --- Startup Seeder Configuration (v2.4) ---
app.seed.enabled=${APP_SEED_ENABLED:true}
app.seed.admin.email=${APP_SEED_ADMIN_EMAIL:admin@university.edu}
app.seed.admin.password=${APP_SEED_ADMIN_PASSWORD:Admin123!}
app.seed.demo-users=${APP_SEED_DEMO_USERS:true}
