services:
  postgres:
    image: postgres:16-alpine
    container_name: registrar-postgres
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_DB: registrar_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5434:5432"
    volumes:
      - registrar_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d registrar_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: registrar-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/registrar_db
      DB_USERNAME: postgres
      CORS_ALLOWED_ORIGINS: http://localhost:3005,http://localhost:5173
      PORT: 8081
      APP_SEED_ENABLED: "true"
  
      APP_SEED_ADMIN_EMAIL: admin@university.edu
      APP_SEED_ADMIN_PASSWORD: Admin123!
      APP_SEED_DEMO_USERS: "true"
    ports:
      - "8081:8081"
      

  frontend:
    build:
      context: ../registrar-portal
      dockerfile: Dockerfile
      args:
        VITE_API_URL: /api
    container_name: registrar-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3005:80"

volumes:
  registrar_pgdata: